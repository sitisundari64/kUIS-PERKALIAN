<!DOCTYPE html> <html lang="id"> <head> <meta charset="UTF-8" /> <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <title>Game Perkalian Kelas 4 SD</title> <style> * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; font-family: Arial, sans-serif; background: linear-gradient(135deg, #dbeafe, #fef3c7); color: #1f2937; } .container { width: 100%; max-width: 760px; background: #ffffff; border-radius: 20px; padding: 28px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15); } h1 { margin-top: 0; text-align: center; color: #2563eb; font-size: 2rem; } .subtitle { text-align: center; color: #6b7280; margin-bottom: 24px; } .question-card { background: #f8fafc; border: 2px solid #e5e7eb; border-radius: 14px; padding: 18px; margin-bottom: 18px; } .question { font-size: 1.1rem; font-weight: bold; margin-bottom: 14px; } .option { display: block; padding: 12px 14px; margin: 8px 0; border: 1px solid #cbd5e1; border-radius: 10px; cursor: pointer; transition: 0.2s; background: #ffffff; } .option:hover { background: #eff6ff; border-color: #3b82f6; } .option input { margin-right: 8px; cursor: pointer; } button { width: 100%; border: none; border-radius: 12px; padding: 14px 20px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; } #submitButton { background: #2563eb; color: white; } #submitButton:hover { background: #1d4ed8; } #retryButton { display: none; margin-top: 12px; background: #16a34a; color: white; } #retryButton:hover { background: #15803d; } #result { display: none; margin-top: 22px; padding: 18px; border-radius: 12px; text-align: center; font-size: 1.2rem; font-weight: bold; background: #dcfce7; color: #166534; } footer { text-align: center; margin-top: 24px; padding-top: 16px; border-top: 1px solid #e5e7eb; color: #6b7280; font-size: 0.9rem; } @media (max-width: 600px) { .container { padding: 20px; } h1 { font-size: 1.6rem; } } </style> </head> <body> <main class="container"> <h1>Game Perkalian Kelas 4 SD</h1> <p class="subtitle">Pilih jawaban yang paling tepat!</p> <form id="quizForm"> <div class="question-card"> <div class="question">1. Berapakah hasil dari 6 × 7?</div> <label class="option"> <input type="radio" name="question1" value="42" /> 42 </label> <label class="option"> <input type="radio" name="question1" value="36" /> 36 </label> <label class="option"> <input type="radio" name="question1" value="48" /> 48 </label> <label class="option"> <input type="radio" name="question1" value="56" /> 56 </label> </div> <div class="question-card"> <div class="question">2. Berapakah hasil dari 8 × 9?</div> <label class="option"> <input type="radio" name="question2" value="63" /> 63 </label> <label class="option"> <input type="radio" name="question2" value="72" /> 72 </label> <label class="option"> <input type="radio" name="question2" value="81" /> 81 </label> <label class="option"> <input type="radio" name="question2" value="64" /> 64 </label> </div> <div class="question-card"> <div class="question">3. Berapakah hasil dari 12 × 4?</div> <label class="option"> <input type="radio" name="question3" value="36" /> 36 </label> <label class="option"> <input type="radio" name="question3" value="48" /> 48 </label> <label class="option"> <input type="radio" name="question3" value="52" /> 52 </label> <label class="option"> <input type="radio" name="question3" value="44" /> 44 </label> </div> <div class="question-card"> <div class="question">4. Berapakah hasil dari 15 × 3?</div> <label class="option"> <input type="radio" name="question4" value="35" /> 35 </label> <label class="option"> <input type="radio" name="question4" value="40" /> 40 </label> <label class="option"> <input type="radio" name="question4" value="45" /> 45 </label> <label class="option"> <input type="radio" name="question4" value="50" /> 50 </label> </div> <div class="question-card"> <div class="question">5. Berapakah hasil dari 11 × 6?</div> <label class="option"> <input type="radio" name="question5" value="55" /> 55 </label> <label class="option"> <input type="radio" name="question5" value="66" /> 66 </label> <label class="option"> <input type="radio" name="question5" value="72" /> 72 </label> <label class="option"> <input type="radio" name="question5" value="60" /> 60 </label> </div> <button type="submit" id="submitButton"> Periksa Jawaban </button> <button type="button" id="retryButton"> Ulangi Kuis </button> </form> <div id="result"></div> <footer> Copyright 2026 SITI SUNDARI, M.Pd. </footer> </main> <script> const quizForm = document.getElementById("quizForm"); const result = document.getElementById("result"); const submitButton = document.getElementById("submitButton"); const retryButton = document.getElementById("retryButton"); const correctAnswers = { question1: "42", question2: "72", question3: "48", question4: "45", question5: "66" }; quizForm.addEventListener("submit", function (event) { event.preventDefault(); let score = 0; let unanswered = 0; Object.keys(correctAnswers).forEach(function (questionName) { const selectedAnswer = document.querySelector( `input[name="${questionName}"]:checked` ); if (!selectedAnswer) { unanswered++; } else if (selectedAnswer.value === correctAnswers[questionName]) { score++; } }); if (unanswered > 0) { result.style.display = "block"; result.style.background = "#fef3c7"; result.style.color = "#92400e"; result.textContent = `Silakan jawab semua soal terlebih dahulu. Masih ada ${unanswered} soal yang belum dijawab.`; return; } const finalScore = score * 20; result.style.display = "block"; result.style.background = "#dcfce7"; result.style.color = "#166534"; result.innerHTML = `Skor kamu: ${finalScore}<br>` + `Jawaban benar: ${score} dari 5 soal`; submitButton.style.display = "none"; retryButton.style.display = "block"; }); retryButton.addEventListener("click", function () { quizForm.reset(); result.style.display = "none"; result.textContent = ""; submitButton.style.display = "block"; retryButton.style.display = "none"; window.scrollTo({ top: 0, behavior: "smooth" }); }); </script> </body> </html>
